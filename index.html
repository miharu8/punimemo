<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぷにメモ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FFF9EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぷにメモ">
<style>
:root{--lav:#E8DDF8;--mint:#D9F0E5;--peach:#FFDFD2;--lem:#FFF1BF;--bg:#FFF9EF;--tx:#4a4458;--sub:#7a7288;--ln:#E0D6EE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:20px;margin:0}h2{font-size:15px;color:var(--sub);margin:18px 0 8px;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center}
.card{border-radius:20px;padding:14px 16px;margin-bottom:10px;background:var(--lav)}
.peach{background:var(--peach)}.mint{background:var(--mint)}.lem{background:var(--lem)}.wh{background:#fff;border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:13px;color:var(--sub)}.pill{background:var(--bg);border-radius:14px;padding:4px 10px;font-size:13px;white-space:nowrap}
button{font:inherit;color:var(--tx);border:0;border-radius:16px;padding:12px 16px;background:#fff;border:1px solid var(--ln);min-height:46px}
button.main{background:var(--lav);border-color:#cdbbee}button.sm2{padding:6px 12px;min-height:36px;font-size:14px}
input,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--ln);background:#fff;color:var(--tx)}
.hero{text-align:center;margin:8px 0}.hero svg{width:130px;height:130px}
.say{display:inline-block;background:var(--lem);border-radius:18px;padding:8px 16px;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;font-size:11px;padding:4px 6px;min-height:0;color:var(--sub);display:flex;flex-direction:column;align-items:center}
nav button b{font-size:22px;font-weight:400}nav button.on{color:var(--tx)}nav button.on b{filter:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{padding:6px;text-align:center}.grid button.sel{background:var(--lav);border-color:#9d84d6;border-width:2px}.grid svg{width:100%;height:auto}
#sheet{position:fixed;inset:0;background:#4a445888;display:none;align-items:flex-end;z-index:9}#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#sheet label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.first{position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto;padding:24px 16px}
.foot{text-align:center;font-size:11px;color:#9a92a8;letter-spacing:1px;margin:28px 0 8px}
.empty{text-align:center;color:var(--sub);padding:20px}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF=()=>({v:1,ch:null,name:'ぷにちゃん',items:[],ideas:[],notif:{on:false,days:[7,3,1,0]},sent:{}});
let S=DEF(),tab='home';
/* ---- 保存 (IndexedDB) ---- */
const db=()=>new Promise((ok,ng)=>{const r=indexedDB.open('punimemo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
async function load(){try{const d=await db();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}}
async function save(){try{const d=await db();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'data')}catch(e){alert('保存できませんでした。ブラウザの設定を確認してね。')}}
/* ---- キャラクター ---- */
const COL={p:['#F9CFDC','#F4AFC6'],l:['#DCCBF4','#C3A9EA'],m:['#C6EBD9','#9FD8BE']};
const E='#5a4a5a';
const dot=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${E}"/>`;
const arc=x=>`<path d="M${x-5} 53 Q${x} 59 ${x+5} 53" stroke="${E}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
const FACE={
smile:dot(39,54,3.4)+dot(61,54,3.4)+`<path d="M44 63 Q50 70 56 63" stroke="${E}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
sleepy:arc(38)+arc(62)+`<path d="M47 64 Q50 66 53 64" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
wow:dot(38,51,4.6)+dot(62,51,4.6)+'<circle cx="39.6" cy="49.4" r="1.4" fill="#fff"/><circle cx="63.6" cy="49.4" r="1.4" fill="#fff"/><ellipse cx="50" cy="64" rx="3" ry="4" fill="#C9677F"/>'};
const FN={smile:'にっこり',sleepy:'ねむねむ',wow:'びっくり'},CN={p:'ピンク',l:'ラベンダー',m:'ミント'};
function ch(c,f){const k=COL[c]||COL.p;return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(S.name)}"><ellipse cx="50" cy="92" rx="30" ry="4" fill="#000" opacity=".06"/><path d="M50 14 C75 12 93 34 90 58 C88 80 71 90 50 90 C27 90 9 80 11 58 C13 34 28 16 50 14 Z" fill="${k[0]}"/><path d="M14 68 C20 84 36 90 50 90 C70 90 86 82 89 62 C80 76 60 80 14 68 Z" fill="${k[1]}" opacity=".55"/><ellipse cx="36" cy="30" rx="9" ry="5" fill="#fff" opacity=".5" transform="rotate(-25 36 30)"/><ellipse cx="30" cy="62" rx="6" ry="4" fill="#F59FB3" opacity=".6"/><ellipse cx="70" cy="62" rx="6" ry="4" fill="#F59FB3" opacity=".6"/>${FACE[f]||FACE.smile}</svg>`}
function chooser(sel){let h='<div class="grid">';for(const c of 'plm')for(const f in FN)h+=`<button data-a="pick" data-i="${c}${f}" class="${sel==c+f?'sel':''}" aria-label="${CN[c]} ${FN[f]}">${ch(c,f)}<div class="sm">${FN[f]}</div></button>`;return h+'</div>'}
/* ---- 日付 ---- */
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const diff=d=>Math.round((Date.parse(d)-Date.parse(today()))/864e5);
const fmt=d=>{const [y,m,dd]=d.split('-');return `${+m}月${+dd}日`};
const lab=n=>n<0?'日にちを過ぎています':n==0?'今日':`あと${n}日`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const open_=()=>S.items.filter(i=>!i.done).sort((a,b)=>(a.d+(a.tm||'')).localeCompare(b.d+(b.tm||'')));
/* ---- 画面 ---- */
function card(i){const n=diff(i.d),cl=isPast(i)?'lem':(inPer(i)||n<=3)?'peach':'';return `<div class="card ${cl}"><div class="row"><div><b>${esc(i.t)}</b><div class="sm">${dtxt(i)}</div>${i.memo?`<div class="sm">${esc(i.memo)}</div>`:''}</div><span class="pill">${lab2(i)}</span></div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="sm2" data-a="done" data-i="${i.id}">できた</button><button class="sm2" data-a="edit" data-i="${i.id}">変更</button><button class="sm2" data-a="del" data-i="${i.id}">削除</button></div></div>`}
const endOf=i=>i.e||i.d;
const dtxt=i=>i.e&&i.e!=i.d?`${fmt(i.d)}〜${fmt(i.e)}（${diff(i.e)-diff(i.d)+1}日間）`:fmt(i.d)+(i.tm?' '+esc(i.tm):'');
const isPast=i=>diff(endOf(i))<0,inPer=i=>!!i.e&&diff(i.d)<=0&&diff(i.e)>=0;
const lab2=i=>isPast(i)?'日にちを過ぎています':inPer(i)?'期間中':lab(diff(i.d));
let msg='';
function say(near,any){const A=near?['あっ、あの件が近づいてきた！','そろそろ、あれの出番かも','ちょっと確認してみる？']:any?['まだここにいたのね（笑）','自分のペースで大丈夫','急がなくてもいいよ〜']:['今日はどんな日？','おかえり〜！今日も地球は回ってる','いつかやりたいこと、増えた？'];return pick(A)}
function view(){
 const o=open_(),near=o.filter(i=>diff(i.d)<=7);let h='';
 if(tab=='home'){const c=S.ch[0],f=o.some(i=>diff(i.d)<=3)?'wow':S.ch.slice(1);
  h=`<div class="top"><h1>ぷにメモ</h1><span class="sm">${fmt(today())}</span></div><div class="hero">${ch(c,f)}<div><span class="say">${esc(msg)}</span></div><div class="sm" style="margin-top:6px">${esc(S.name)}</div></div><h2>近づいてきた予定</h2>${near.length?near.slice(0,5).map(card).join(''):'<div class="empty">いまのところ、近い予定はないよ</div>'}<div class="card mint row" data-a="tab" data-i="ideas" style="cursor:pointer"><div><b>いつかやりたいこと</b><div class="sm">ポイっと入れておこう（${S.ideas.length}）</div></div><span style="font-size:24px">＋</span></div>`}
 if(tab=='dates')h=`<div class="top"><h1>日にちが決まっていること</h1></div><p><button class="main" data-a="new" style="width:100%">＋ 予定を入れる</button></p>${o.length?o.map(card).join(''):'<div class="empty">まだ予定はないよ</div>'}`;
 if(tab=='ideas')h=`<h1>いつかやりたいこと</h1><p class="sm">夢でも思いつきでも、なんでもポイ。日にちはあとで決めればOK</p><p><input id="idea" placeholder="いつかやりたいこと、ここに書いてね" maxlength="200"></p><p><input id="idea2" placeholder="メモ（なくてもOK）" maxlength="300"></p><p><button class="main" data-a="addidea" style="width:100%">ポイっと入れる</button></p>${S.ideas.length?S.ideas.map((x,n)=>`<div class="card mint"><div class="sm">No.${n+1}</div><b>${esc(x.t)}</b>${x.memo?`<div class="sm">メモ：${esc(x.memo)}</div>`:''}<div class="row" style="margin-top:8px;justify-content:flex-end;flex-wrap:wrap"><button class="sm2" data-a="todate" data-i="${x.id}">日にち決まった！</button><button class="sm2" data-a="grant" data-i="${x.id}">叶った</button><button class="sm2" data-a="editidea" data-i="${x.id}">編集</button><button class="sm2" data-a="delidea" data-i="${x.id}">削除</button></div></div>`).reverse().join(''):'<div class="empty">ここは自由な場所。なんでも入れてね</div>'}`;
 if(tab=='done'){const d=S.items.filter(i=>i.done).sort((a,b)=>b.done.localeCompare(a.done));h=`<h1>完了したこと</h1><p class="sm">こんなことをしてきたんだね</p>${d.length?d.map(i=>`<div class="card wh"><div class="row"><div><b>${esc(i.t)}</b><div class="sm">${fmt(i.done)} に完了</div></div><button class="sm2" data-a="undo" data-i="${i.id}">元に戻す</button></div></div>`).join(''):'<div class="empty">まだ何もないよ</div>'}`}
 if(tab=='set')h=`<h1>設定</h1><h2>キャラクター</h2>${chooser(S.ch)}<h2>名前</h2><input id="nm" value="${esc(S.name)}" maxlength="12"><h2>通知</h2><div class="card wh"><label><input type="checkbox" id="nt" style="width:auto" ${S.notif.on?'checked':''}> アプリを開いたときにお知らせする</label><div class="sm" style="margin:6px 0">お知らせするタイミング</div>${[7,3,1,0].map(d=>`<label style="margin-right:10px"><input type="checkbox" class="nd" value="${d}" style="width:auto" ${S.notif.days.includes(d)?'checked':''}> ${d?d+'日前':'当日'}</label>`).join('')}<div class="sm" style="margin-top:8px">※アプリを閉じている間の通知は、無料の範囲では届かないことがあります。ホーム画面で近い予定を確認できます。</div></div><h2>データ</h2><p><button data-a="bk" style="width:100%">バックアップを保存</button></p><p><button data-a="rs" style="width:100%">バックアップから復元</button><input type="file" id="fl" accept=".json" hidden></p><p><button data-a="rst" style="width:100%">すべて初期化</button></p><h2>アプリ情報</h2><p class="sm">ぷにメモ v1.1 ／ データはこの端末の中だけに保存されます。</p>`;
 $('#app').innerHTML=h+'<div class="foot">Presented by 波動調整師 千鈴龍穂</div>';
 $('#nav').innerHTML=[['home','🏠','ホーム'],['dates','📅','日にち'],['ideas','💡','いつか'],['done','✅','完了'],['set','⚙️','設定']].map(t=>`<button data-a="tab" data-i="${t[0]}" class="${tab==t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('');
 const nt=$('#nt');if(nt){nt.onchange=async()=>{if(nt.checked&&window.Notification&&Notification.permission!='granted'){const p=await Notification.requestPermission();if(p!='granted'){nt.checked=false;alert('通知は許可されなかったよ。アプリは今まで通り使えるよ。')}}S.notif.on=nt.checked;save()};document.querySelectorAll('.nd').forEach(c=>c.onchange=()=>{S.notif.days=[...document.querySelectorAll('.nd:checked')].map(x=>+x.value);save()});$('#nm').onchange=e=>{S.name=e.target.value.trim()||'ぷにちゃん';save()};$('#fl').onchange=restore}
}
let rng=false;
function sheet(it,idea){const i=it||{t:idea?idea.t:'',d:today(),tm:'',memo:idea?idea.memo||'':'',e:''};rng=!!(i.e&&i.e!=i.d);$('#sh').innerHTML=`<h1>${it?'予定を変更':'予定を入れる'}</h1><label>やること</label><input id="f1" value="${esc(i.t)}" maxlength="100"><div class="row" style="margin:12px 0 0"><button id="m1" data-a="mode" data-i="one" style="flex:1">1日だけ</button><button id="m2" data-a="mode" data-i="range" style="flex:1">期間（旅行・出張）</button></div><div class="row" style="align-items:flex-end"><div style="flex:1;min-width:0"><label id="l2">日にち</label><input id="f2" type="date" value="${i.d}"></div><div id="ew" style="flex:1;min-width:0"><label>おわり</label><input id="f5" type="date" value="${i.e||i.d}"></div></div><label>時刻（なくてもOK）</label><input id="f3" type="time" value="${i.tm||''}"><label>メモ</label><textarea id="f4" rows="3">${esc(i.memo||'')}</textarea><div class="row" style="margin-top:16px"><button data-a="close">やめる</button><button class="main" data-a="saveitem" data-i="${it?it.id:''}" data-j="${idea?idea.id:''}">保存する</button></div>`;mode();$('#sheet').classList.add('on')}
function mode(){$('#ew').style.display=rng?'block':'none';$('#l2').textContent=rng?'はじまり':'日にち';$('#m1').className=rng?'':'main';$('#m2').className=rng?'main':''}
async function act(a,i,j){
 if(a=='tab'){tab=i;msg=say(open_().some(x=>diff(x.d)<=7),open_().length>0);view();scrollTo(0,0)}
 if(a=='pick'){S.ch=i;await save();firstRun(false);view()}
 if(a=='new')sheet();
 if(a=='mode'){rng=i=='range';mode()}
 if(a=='edit')sheet(S.items.find(x=>x.id==i));
 if(a=='close')$('#sheet').classList.remove('on');
 if(a=='saveitem'){const t=$('#f1').value.trim(),d=$('#f2').value;if(!t||!d){alert('やることと日にちを入れてね');return}const e=rng?$('#f5').value:'';if(rng&&(!e||e<d)){alert('おわりの日は、はじまりの日と同じか、あとの日にしてね');return}const v={t,d,e,tm:$('#f3').value,memo:$('#f4').value.trim()};if(i){Object.assign(S.items.find(x=>x.id==i),v)}else{S.items.push({id:uid(),done:null,...v});if(j)S.ideas=S.ideas.filter(x=>x.id!=j)}await save();$('#sheet').classList.remove('on');view()}
 if(a=='done'){S.items.find(x=>x.id==i).done=today();await save();view()}
 if(a=='undo'){S.items.find(x=>x.id==i).done=null;await save();view()}
 if(a=='del'&&confirm('この予定を削除するよ。いいかな？')){S.items=S.items.filter(x=>x.id!=i);await save();view()}
 if(a=='addidea'){const t=$('#idea').value.trim();if(!t)return;S.ideas.push({id:uid(),t,memo:($('#idea2').value||'').trim()});await save();view()}
 if(a=='editidea'){const x=S.ideas.find(x=>x.id==i),t=prompt('いつかやりたいことを直す',x.t);if(t&&t.trim()){x.t=t.trim();const m=prompt('メモ（空にするとメモなし）',x.memo||'');if(m!==null)x.memo=m.trim();await save();view()}}
 if(a=='delidea'&&confirm('これを削除するよ。いいかな？')){S.ideas=S.ideas.filter(x=>x.id!=i);await save();view()}
 if(a=='grant'){const x=S.ideas.find(x=>x.id==i);S.items.push({id:uid(),t:x.t,d:today(),e:'',tm:'',memo:x.memo||'',done:today()});S.ideas=S.ideas.filter(y=>y.id!=i);await save();view()}
 if(a=='todate')sheet(null,S.ideas.find(x=>x.id==i));
 if(a=='bk'){const b=new Blob([JSON.stringify({app:'punimemo',version:1,date:today(),data:S},null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='punimemo-backup-'+today()+'.json';l.click()}
 if(a=='rs')$('#fl').click();
 if(a=='rst'&&confirm('全部のデータを消して、最初の状態に戻すよ。本当にいい？')&&confirm('もう一度確認。元に戻せないよ。')){S=DEF();await save();tab='home';boot2()}
}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!='punimemo'||!j.data||!Array.isArray(j.data.items))throw 0;if(!confirm('いまのデータは、バックアップの内容に置き換わるよ。いいかな？'))return;S={...DEF(),...j.data};await save();alert('復元したよ');boot2()}catch(x){alert('このファイルは読み込めなかったよ')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b.dataset.j)});
function firstRun(on){let f=$('.first');if(f)f.remove();if(!on)return;f=document.createElement('div');f.className='first';f.innerHTML=`<h1>ぷにメモへようこそ</h1><p class="sm">いっしょにいてくれる子を選んでね。あとから変えられるよ。</p>${chooser('')}<div class="foot">Presented by 波動調整師 千鈴龍穂</div>`;document.body.appendChild(f)}
async function notify(){if(!S.notif.on||!window.Notification||Notification.permission!='granted')return;const t=today();for(const i of open_()){const n=diff(i.d);if(!S.notif.days.includes(n)||S.sent[i.id+t])continue;S.sent[i.id+t]=1;const b=n==0?'今日はこの予定の日だよ':n==1?'明日までみたい。ちょっと確認してみる？':'そろそろ近づいてきたよ';try{const r=await navigator.serviceWorker.getRegistration();r?r.showNotification('ぷにメモ：'+i.t,{body:b,icon:'icon-192.png'}):new Notification('ぷにメモ：'+i.t,{body:b})}catch(e){}}await save()}
function boot2(){firstRun(!S.ch);msg=say(open_().some(x=>diff(x.d)<=7),open_().length>0);view();if(S.ch)notify()}
(async()=>{const d=await load();if(d)S={...DEF(),...d};boot2()})();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js');navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
</script></body></html>
